[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PROJECT_NAME_KEBAB}}"
version = "0.1.0"
description = "{{PROJECT_NAME}}"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
{{PROJECT_NAME_KEBAB}} = "{{PROJECT_NAME_SNAKE}}.server:main"

[tool.setuptools.packages.find]
where = ["src"]
